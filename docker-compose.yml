version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: auto_apply_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-career_navigator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: auto_apply_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/career_navigator
      - SYNC_DATABASE_URL=postgresql://postgres:postgres@db:5432/career_navigator
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: auto_apply_scheduler
    restart: always
    depends_on:
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/career_navigator
      - SYNC_DATABASE_URL=postgresql://postgres:postgres@db:5432/career_navigator
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "backend.app.scheduler.runner"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: auto_apply_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
